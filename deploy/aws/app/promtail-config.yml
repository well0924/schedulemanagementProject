server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.0.1.73:3100/loki/api/v1/push

scrape_configs:
  - job_name: schedule-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: schedule-backend
          host: service-2
          __path__: /var/log/schedule-backend/*.log

  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          host: service-2
          __path__: /var/log/redis/*.log
