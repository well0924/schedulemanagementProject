events {
    worker_connections 4096; # 기본 1024에서 4배로 확장
    multi_accept on;       # 한 번에 여러 연결을 수락
    use epoll;             # 리눅스 환경에서 최적화된 이벤트 모델 사용
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    
    keepalive_timeout 65;
    keepalive_requests 10000;

    # 로드밸런싱 설정: 포트 번호를 다르게 지정
    upstream backend-cluster {
        ip_hash;
        # least_conn; # 연결이 적은 쪽으로 우선 배분
        server 10.0.1.130:8082 max_fails=3 fail_timeout=10s;
        server 10.0.1.145:8082 max_fails=3 fail_timeout=10s;
        keepalive 100; # 커넥션 풀을 32에서 100으로 상향
    }

    # 80 포트 → https 리다이렉트
    server {
        listen 80;
        server_name api.schedulemanagement.shop;
        #server_name localhost;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /metrics {
                    stub_status on;
                    allow all;
        }

        location /api/actuator/prometheus {
            #proxy_pass http://backend:8082/actuator/prometheus;
            proxy_pass http://backend-cluster/actuator/prometheus;
            proxy_set_header Host $host;
        }

        #location /redis-exporter/ {
        #    proxy_pass http://redis-exporter:9121/;
        #}

        #location /kafka-exporter/ {
        #    proxy_pass http://kafka-exporter:9308/;
        #}

        location /api/ {
                proxy_pass http://backend-cluster/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                # JMeter에서 어느 서버로 갔는지 확인용
                add_header X-Upstream-Addr $upstream_addr always;
                # 타임아웃 살짝 상향 (너무 짧으면 502 유발)
                proxy_connect_timeout 3s; 
                proxy_read_timeout 10s;
                proxy_send_timeout 10s;

                # SPOF용
                proxy_next_upstream error timeout http_500 http_502 http_503;
                proxy_next_upstream_tries 2;
        }

        location /ws/ {
                proxy_pass http://backend-cluster/ws/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
        }

        # 로컬 테스트 시 리다이렉트 주석처리
        # location / {
        #     return 301 https://$host$request_uri;
        # }
    }

    # HTTPS 서버
    server {
        listen 443 ssl;
        server_name api.schedulemanagement.shop;

        ssl_certificate     /etc/letsencrypt/live/api.schedulemanagement.shop/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.schedulemanagement.shop/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Prometheus
        location /api/actuator/prometheus {
            proxy_pass http://backend-cluster/actuator/prometheus;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://backend-cluster/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

        }

        # API 프록시
        location /api/ {
            proxy_pass http://backend-cluster/api/; # 백엔드 context-path가 /api인 경우
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream-Addr $upstream_addr always;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s; 
            proxy_send_timeout 10s;
        }
    }
}
