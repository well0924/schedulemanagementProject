name: Schedule Project CI with Compose

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: schedule
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Run unit & integration tests
        run: ./gradlew clean test
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_SCHEDULING_ENABLED: false

      # PR: 이미지가 만들어지는지만 확인 (레지스트리에 올리지 않음)
      - name: Build image tarball with Jib (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew :bootstrap:jibBuildTar

      # main push: Docker Hub에 latest + 커밋 해시 태그로 올린다. deploy.yml이 이 latest를 받아 배포한다.
      # (예전엔 jibDockerBuild라 러너 안에서만 이미지가 만들어지고 사라져, 배포가 옛 이미지를 받았다)
      - name: Build and push image with Jib (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :bootstrap:jib -Djib.to.tags=${{ github.sha }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
