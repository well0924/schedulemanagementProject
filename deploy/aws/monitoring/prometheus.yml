global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'schedule-service-1'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['10.0.1.130:8082']

  - job_name: 'schedule-service-2'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['10.0.1.145:8082']

  - job_name: 'redis-exporter-1'
    static_configs:
      - targets: ['10.0.1.98:9121']

  - job_name: 'node-exporter-1'
    static_configs:
      - targets: ['10.0.1.130:9100']

  - job_name: 'node-exporter-2'
    static_configs:
      - targets: ['10.0.1.145:9100']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['10.0.1.98:9308']