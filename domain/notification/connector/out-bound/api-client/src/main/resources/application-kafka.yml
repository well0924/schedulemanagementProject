spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}  # 또는 EC2/Lightsail 주소
    # 아래 consumer/listener 설정은 Spring Boot 기본 리스너 팩토리에만 적용된다.
    # = containerFactory를 지정하지 않은 retry 토픽·DLQ 리스너
    #   (NotificationRetryTopicConsumer, MemberSignUpRetryTopicConsumer, Dlq*RetryConsumer).
    # 알림·회원가입·챗봇 컨슈머와 모든 프로듀서는 KafkaConsumerConfig, KafkaProducerConfig에서 따로 설정한다.
    consumer:
      group-id: notification-events
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL  # 처리가 끝난 뒤 직접 ack
      concurrency: 1    # retry·DLQ 토픽은 처리량이 작아 인스턴스당 1개면 충분
